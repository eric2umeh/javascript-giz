<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Tracker</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Student Grade Tracker</h1>

      <!-- ========== Student Form ============================ -->

      <div class="form">
        <div class="form-group">
          <label>Student Name</label>

          <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
          />
        </div>

        <div class="form-group">
          <label>Student Score</label>

          <input
            type="number"
            id="studentScore"
            placeholder="Enter score (0 - 100)"
          />
        </div>

        <button id="addBtn">Add Student</button>
      </div>

      <!-- ==========  Statistics Section ======= -->

      <div class="summary">
        <div class="card">
          <h3>Total Students</h3>
          <p id="totalStudents">0</p>
        </div>

        <div class="card">
          <h3>Class Average</h3>
          <p id="averageScore">0</p>
        </div>

        <div class="card">
          <h3>Top Student</h3>
          <p id="topStudent">N/A</p>
        </div>
      </div>

      <!-- ============= Student Table ========== -->

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Score</th>
            <th>Grade</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="studentTable"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
